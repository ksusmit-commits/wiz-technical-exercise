name: Build and Push Tasky

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::886436966911:role/github-actions-role
          aws-region: us-east-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t tasky .

      - name: Tag Docker Image
        run: |
          docker tag tasky:latest \
          886436966911.dkr.ecr.us-east-2.amazonaws.com/tasky:latest

      - name: Push Docker Image
        run: |
          docker push \
          886436966911.dkr.ecr.us-east-2.amazonaws.com/tasky:latest

